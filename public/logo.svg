<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818CF8;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:0" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Subtle inner glow -->
  <ellipse cx="180" cy="160" rx="200" ry="160" fill="url(#glow)" opacity="0.6"/>

  <!-- Rupee symbol ₹ -->
  <!-- Top bar -->
  <rect x="158" y="128" width="196" height="36" rx="18" fill="white"/>
  <!-- Second bar -->
  <rect x="158" y="188" width="196" height="36" rx="18" fill="white"/>
  <!-- Vertical left stem -->
  <rect x="158" y="128" width="38" height="256" rx="19" fill="white"/>
  <!-- Diagonal strike through -->
  <line x1="178" y1="224" x2="354" y2="384" stroke="white" stroke-width="38" stroke-linecap="round"/>

  <!-- AI Sparkle — top right -->
  <!-- Center star -->
  <circle cx="368" cy="144" r="14" fill="#FCD34D"/>
  <!-- Sparkle rays -->
  <line x1="368" y1="120" x2="368" y2="110" stroke="#FCD34D" stroke-width="6" stroke-linecap="round"/>
  <line x1="368" y1="168" x2="368" y2="178" stroke="#FCD34D" stroke-width="6" stroke-linecap="round"/>
  <line x1="344" y1="144" x2="334" y2="144" stroke="#FCD34D" stroke-width="6" stroke-linecap="round"/>
  <line x1="392" y1="144" x2="402" y2="144" stroke="#FCD34D" stroke-width="6" stroke-linecap="round"/>
  <line x1="351" y1="127" x2="344" y2="120" stroke="#FCD34D" stroke-width="5" stroke-linecap="round"/>
  <line x1="385" y1="161" x2="392" y2="168" stroke="#FCD34D" stroke-width="5" stroke-linecap="round"/>
  <line x1="351" y1="161" x2="344" y2="168" stroke="#FCD34D" stroke-width="5" stroke-linecap="round"/>
  <line x1="385" y1="127" x2="392" y2="120" stroke="#FCD34D" stroke-width="5" stroke-linecap="round"/>
</svg>
